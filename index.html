<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnival Game Booths — 3D Sample</title>
<style>
  body { margin: 0; overflow: hidden; background: #060608; font-family: system-ui, sans-serif; }
  #info {
    position: absolute; top: 12px; left: 12px; color: #fff;
    background: rgba(0,0,0,0.65); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; max-width: 300px; line-height: 1.5;
  }
  #info b { color: #ffd54a; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="info">
  <b>Carnival Game Booths</b> — from your photo<br>
  No humans · GTA-level detail target<br>
  Drag to orbit · Scroll to zoom
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let seed = 98765;
function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function rr(a, b) { return a + rand() * (b - a); }
function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060608);
scene.fog = new THREE.Fog(0x060608, 30, 70);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(3.5, 3.2, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.6, 0);
controls.update();

// Night ambient
scene.add(new THREE.AmbientLight(0x6a6a80, 0.4));

// Ground — asphalt
{
  const g = new THREE.CircleGeometry(32, 48);
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#1c1c1e'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 3000; i++) {
    x.fillStyle = `rgba(${rand()>0.5?255:0},${rand()>0.5?255:0},${rand()>0.5?255:10},${rand()*0.05})`;
    x.fillRect(rand()*256, rand()*256, 1.5, 1.5);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(8, 8);
  tex.colorSpace = THREE.SRGBColorSpace;
  const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 }));
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);
}

function perturb(geo, amp) {
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setXYZ(i, pos.getX(i)+(rand()-0.5)*amp, pos.getY(i)+(rand()-0.5)*amp, pos.getZ(i)+(rand()-0.5)*amp);
  }
  geo.computeVertexNormals();
  return geo;
}

// === REAL PHOTO TEXTURES (CC0 from Poly Haven) ===
const texLoader = new THREE.TextureLoader();
function loadPBR(base, repeatX = 1, repeatY = 1) {
  const maps = {};
  const diff = texLoader.load(`textures/${base}_diff.jpg`);
  diff.colorSpace = THREE.SRGBColorSpace;
  diff.wrapS = diff.wrapT = THREE.RepeatWrapping;
  diff.repeat.set(repeatX, repeatY);
  diff.anisotropy = 8;
  maps.map = diff;
  const rough = texLoader.load(`textures/${base}_rough.jpg`);
  rough.wrapS = rough.wrapT = THREE.RepeatWrapping;
  rough.repeat.set(repeatX, repeatY);
  maps.roughnessMap = rough;
  const nor = texLoader.load(`textures/${base}_nor_gl.jpg`);
  nor.wrapS = nor.wrapT = THREE.RepeatWrapping;
  nor.repeat.set(repeatX, repeatY);
  maps.normalMap = nor;
  return maps;
}
const woodTex = loadPBR('dark_wooden_planks', 2, 1);
const metalTex = loadPBR('metal_plate', 1, 1);
const woodMat = new THREE.MeshStandardMaterial({ ...woodTex, roughness: 1.0, metalness: 0.0 });
const metalMat = new THREE.MeshStandardMaterial({ ...metalTex, roughness: 1.0, metalness: 0.6 });

// ============================================================
// MAIN BASKETBALL BOOTH
// ============================================================
const booth = new THREE.Group();
const BW = 9, BD = 5, WALL_H = 3.6;

// Bright interior lighting — like photo's fluorescent strips
const boothLight1 = new THREE.PointLight(0xfff4e0, 90, 16);
boothLight1.position.set(-2, 4.2, 1);
booth.add(boothLight1);
const boothLight2 = new THREE.PointLight(0xfff4e0, 90, 16);
boothLight2.position.set(2, 4.2, 1);
booth.add(boothLight2);
const frontWash = new THREE.SpotLight(0xffe8c0, 120, 25, Math.PI/4, 0.5);
frontWash.position.set(0, 5, 8);
frontWash.target.position.set(0, 2, 0);
booth.add(frontWash);
booth.add(frontWash.target);

// Structure
const frameMat = new THREE.MeshStandardMaterial({ color: 0x8a8a8e, roughness: 0.5, metalness: 0.4 });
{
// Floor
  const f = new THREE.Mesh(new THREE.BoxGeometry(BW, 0.12, BD), new THREE.MeshStandardMaterial({ color: 0x4a3a28, roughness: 0.85 }));
  f.position.y = 0.06; f.receiveShadow = true;
  booth.add(f);
  // Back wall — white with red trim (like photo)
  const bw = new THREE.Mesh(new THREE.BoxGeometry(BW, WALL_H, 0.15), new THREE.MeshStandardMaterial({ color: 0xe8e4dc, roughness: 0.7 }));
  bw.position.set(0, WALL_H/2 + 0.1, -BD/2);
  bw.receiveShadow = true;
  booth.add(bw);
  // Side walls
  for (const sx of [-1, 1]) {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(0.15, WALL_H, BD), new THREE.MeshStandardMaterial({ color: 0xd8d4cc, roughness: 0.7 }));
    sw.position.set(sx*BW/2, WALL_H/2 + 0.1, 0);
    sw.castShadow = true;
    booth.add(sw);
  }
  // Roof frame
  const roof = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.6, 0.15, BD + 0.8), new THREE.MeshStandardMaterial({ color: 0x3a3a3e, roughness: 0.6 }));
  roof.position.set(0, WALL_H + 0.35, 0);
  roof.castShadow = true;
  booth.add(roof);
  // Striped awning edge (red/yellow/teal like photo)
  const ac = document.createElement('canvas');
  ac.width = 512; ac.height = 64;
  const ax = ac.getContext('2d');
  const stripeCols = ['#c02828', '#e8b828', '#189090', '#e87818'];
  for (let s = 0; s < 16; s++) {
    ax.fillStyle = stripeCols[s % 4];
    ax.fillRect(s*32, 0, 32, 64);
  }
  const atex = new THREE.CanvasTexture(ac);
  atex.wrapS = THREE.RepeatWrapping;
  atex.colorSpace = THREE.SRGBColorSpace;
  const awn = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.6, 0.5, 0.1), new THREE.MeshStandardMaterial({ map: atex, roughness: 0.8 }));
  awn.position.set(0, WALL_H + 0.05, BD/2 + 0.35);
  booth.add(awn);
  // Corner posts
  for (const sx of [-1,1]) for (const sz of [-1,1]) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, WALL_H + 0.5, 10), frameMat);
    p.position.set(sx*(BW/2-0.1), (WALL_H+0.5)/2, sz*(BD/2-0.1));
    p.castShadow = true;
    booth.add(p);
  }
}

// === WINS CHOICE SIGN — weathered painted wood ===
{
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 160;
  const x = c.getContext('2d');
  // Aged white paint with wood showing through
  x.fillStyle = '#e8e2d6'; x.fillRect(0, 0, 1024, 160);
  // Wood grain showing through worn paint
  for (let i = 0; i < 40; i++) {
    x.strokeStyle = `rgba(120,90,60,${rr(0.05,0.15)})`;
    x.lineWidth = rr(1,3);
    const wy = rand()*160;
    x.beginPath(); x.moveTo(0, wy);
    x.bezierCurveTo(300, wy+rr(-8,8), 700, wy+rr(-8,8), 1024, wy+rr(-5,5));
    x.stroke();
  }
  // Paint drips and aging
  for (let i = 0; i < 30; i++) {
    x.fillStyle = `rgba(180,170,150,${rr(0.1,0.25)})`;
    x.fillRect(rand()*1024, rand()*160, rr(2,6), rr(10,40));
  }
  // Red letters with slight fade and edge wear
  x.fillStyle = '#b83018';
  x.font = 'bold 92px Arial Black, sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('WINS CHOICE', 512, 84);
  // Letter highlight (paint thickness)
  x.fillStyle = 'rgba(255,120,80,0.2)';
  x.font = 'bold 92px Arial Black, sans-serif';
  x.fillText('WINS CHOICE', 512, 82);
  // Wear on letters
  x.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 150; i++) {
    x.fillStyle = `rgba(0,0,0,${rr(0.2,0.6)})`;
    x.fillRect(200 + rand()*624, 30 + rand()*100, rr(1,5), rr(1,4));
  }
  x.globalCompositeOperation = 'source-over';
  // Small basketball icon — hand-painted
  x.fillStyle = '#c85818';
  x.beginPath(); x.arc(950, 80, 34, 0, Math.PI*2); x.fill();
  x.strokeStyle = '#6a2810'; x.lineWidth = 4;
  x.beginPath(); x.arc(950, 80, 34, 0, Math.PI*2); x.stroke();
  x.beginPath(); x.moveTo(916, 80); x.lineTo(984, 80); x.stroke();
  x.beginPath(); x.moveTo(950, 46); x.lineTo(950, 114); x.stroke();
  // Wood frame around sign
  x.strokeStyle = '#5a3a20'; x.lineWidth = 12;
  x.strokeRect(6, 6, 1012, 148);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  const sign = new THREE.Mesh(
    new THREE.BoxGeometry(6.5, 1.0, 0.12, 8, 2, 1),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7, bumpMap: tex, bumpScale: 0.1 })
  );
  sign.position.set(-0.8, 3.35, -BD/2 + 0.15);
  sign.castShadow = true;
  booth.add(sign);
}

// === BASKETBALL HOOPS with real 3D nets ===
function makeHoop() {
  const g = new THREE.Group();
  // Backboard — white with red border, realistic thickness and mounting
  const bbMat = new THREE.MeshStandardMaterial({ color: 0xf0ece4, roughness: 0.35 });
  const bb = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.65, 0.05, 4, 4, 1), bbMat);
  // Slight wear on backboard
  const bbp = bb.geometry.attributes.position;
  for (let i = 0; i < bbp.count; i++) {
    bbp.setZ(i, bbp.getZ(i) + (rand()-0.5)*0.004);
  }
  bb.geometry.computeVertexNormals();
  bb.castShadow = true;
  g.add(bb);
  // Red border frame (not just a box behind)
  const borderMat = new THREE.MeshStandardMaterial({ color: 0xb02020, roughness: 0.5 });
  const borderT = new THREE.Mesh(new THREE.BoxGeometry(0.94, 0.045, 0.055), borderMat);
  borderT.position.set(0, 0.302, 0); g.add(borderT);
  const borderB = borderT.clone(); borderB.position.set(0, -0.302, 0); g.add(borderB);
  const borderL = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.65, 0.055), borderMat);
  borderL.position.set(-0.447, 0, 0); g.add(borderL);
  const borderR = borderL.clone(); borderR.position.set(0.447, 0, 0); g.add(borderR);
  // Mounting bracket — metal plate + bolts
  const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.04), new THREE.MeshStandardMaterial({ color: 0x5a5a5e, roughness: 0.4, metalness: 0.7 }));
  bracket.position.set(0, -0.05, -0.045);
  g.add(bracket);
  for (const [bx, by] of [[-0.1, 0.0], [0.1, 0.0], [-0.1, -0.1], [0.1, -0.1]]) {
    const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.02, 6), new THREE.MeshStandardMaterial({ color: 0x3a3a3e, roughness: 0.3, metalness: 0.8 }));
    bolt.rotation.x = Math.PI/2;
    bolt.position.set(bx, -0.05 + by, -0.07);
    g.add(bolt);
  }
  // Rim — thicker, with mounting arm
  const rimMat = new THREE.MeshStandardMaterial({ color: 0xd84818, roughness: 0.35, metalness: 0.6 });
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.19, 0.028, 12, 32), rimMat);
  rim.rotation.x = Math.PI/2;
  rim.position.set(0, -0.12, 0.24);
  rim.castShadow = true;
  g.add(rim);
  // Rim mounting arm
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.22), rimMat);
  arm.position.set(0, -0.12, 0.08);
  g.add(arm);
  // Net — thicker strands, more levels, realistic
  const netMat = new THREE.MeshStandardMaterial({ color: 0xe8e4d8, roughness: 0.95 });
  const netTopR = 0.185, netBotR = 0.10, netH = 0.36;
  const levels = 5, segs = 10;
  for (let l = 0; l < levels; l++) {
    const r0 = netTopR - (netTopR - netBotR) * (l/levels);
    const r1 = netTopR - (netTopR - netBotR) * ((l+1)/levels);
    const y0 = -0.12 - (l/levels)*netH, y1 = -0.12 - ((l+1)/levels)*netH;
    for (let s = 0; s < segs; s++) {
      const a0 = (s/segs)*Math.PI*2, a1 = ((s+0.5)/segs)*Math.PI*2, a2 = ((s+1)/segs)*Math.PI*2;
      const p0 = new THREE.Vector3(Math.cos(a0)*r0, y0, 0.24 + Math.sin(a0)*r0);
      const p1 = new THREE.Vector3(Math.cos(a1)*r1, y1, 0.24 + Math.sin(a1)*r1);
      const p2 = new THREE.Vector3(Math.cos(a2)*r0, y0, 0.24 + Math.sin(a2)*r0);
      for (const [pa, pb] of [[p0,p1],[p1,p2]]) {
        const dir = new THREE.Vector3().subVectors(pb, pa);
        const len = dir.length();
        const strand = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, len, 5), netMat);
        strand.position.copy(pa).addScaledVector(dir, 0.5);
        strand.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
        strand.castShadow = true;
        g.add(strand);
      }
    }
  }
  // Bottom loop
  const loop = new THREE.Mesh(new THREE.TorusGeometry(netBotR, 0.008, 6, 16), netMat);
  loop.rotation.x = Math.PI/2;
  loop.position.set(0, -0.12 - netH, 0.24);
  g.add(loop);
  return g;
}
for (let i = 0; i < 4; i++) {
  const hoop = makeHoop();
  hoop.position.set(-3.1 + i*1.35, 2.55, -BD/2 + 0.35);
  booth.add(hoop);
}

// === PRIZE SHELVES — colorful balls ===
function makePrizeBall() {
  const type = pick(['basketball', 'playground', 'beachball', 'soccer']);
  const r = rr(0.14, 0.19);
  let mat;
  if (type === 'basketball') {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const x = c.getContext('2d');
    const baseCol = pick(['#c85018', '#b84818', '#d06020']);
    x.fillStyle = baseCol; x.fillRect(0, 0, 256, 256);
    // Pebble grain texture — like real basketball leather
    for (let i = 0; i < 2500; i++) {
      x.fillStyle = `rgba(0,0,0,${rand()*0.12})`;
      x.beginPath(); x.arc(rand()*256, rand()*256, rr(0.8,2.2), 0, Math.PI*2); x.fill();
    }
    for (let i = 0; i < 1200; i++) {
      x.fillStyle = `rgba(255,220,180,${rand()*0.08})`;
      x.beginPath(); x.arc(rand()*256, rand()*256, rr(0.6,1.6), 0, Math.PI*2); x.fill();
    }
    // Seams
    x.strokeStyle = '#2a1206'; x.lineWidth = 7;
    x.beginPath(); x.arc(128, 128, 120, 0, Math.PI*2); x.stroke();
    x.lineWidth = 6;
    x.beginPath(); x.moveTo(8, 128); x.lineTo(248, 128); x.stroke();
    x.beginPath(); x.moveTo(128, 8); x.lineTo(128, 248); x.stroke();
    x.beginPath(); x.arc(40, 128, 90, -0.6, 0.6); x.stroke();
    x.beginPath(); x.arc(216, 128, 90, Math.PI-0.6, Math.PI+0.6); x.stroke();
    // Seam highlight
    x.strokeStyle = 'rgba(255,200,150,0.25)'; x.lineWidth = 2;
    x.beginPath(); x.arc(128, 128, 120, 0, Math.PI*2); x.stroke();
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 8;
    mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.72, bumpMap: tex, bumpScale: 0.4 });
  } else if (type === 'playground') {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const x = c.getContext('2d');
    const base = pick(['#c82828', '#2868c8', '#38a038', '#d8a828', '#7838b8', '#d86818']);
    x.fillStyle = base; x.fillRect(0, 0, 128, 128);
    // Rubber texture
    for (let i = 0; i < 800; i++) {
      x.fillStyle = `rgba(0,0,0,${rand()*0.1})`;
      x.fillRect(rand()*128, rand()*128, 1.5, 1.5);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.55, bumpMap: tex, bumpScale: 0.2 });
  } else if (type === 'beachball') {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const x = c.getContext('2d');
    const cols = ['#d83838', '#f2f2f2', '#2878d8', '#f2f2f2', '#38a838', '#f2f2f2'];
    for (let s = 0; s < 6; s++) {
      x.fillStyle = cols[s]; x.fillRect(s*43, 0, 44, 128);
      // Vinyl sheen variation
      x.fillStyle = `rgba(255,255,255,${rand()*0.1})`;
      x.fillRect(s*43, 0, 44, 20);
    }
    // Panel seams
    x.strokeStyle = 'rgba(0,0,0,0.25)'; x.lineWidth = 2;
    for (let s = 0; s <= 6; s++) { x.beginPath(); x.moveTo(s*43, 0); x.lineTo(s*43, 128); x.stroke(); }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.32 });
  } else {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const x = c.getContext('2d');
    x.fillStyle = '#ececec'; x.fillRect(0, 0, 256, 256);
    // Leather grain
    for (let i = 0; i < 1500; i++) {
      x.fillStyle = `rgba(0,0,0,${rand()*0.06})`;
      x.fillRect(rand()*256, rand()*256, 1.5, 1.5);
    }
    x.fillStyle = '#161616';
    for (let i = 0; i < 10; i++) {
      const px = 20+rand()*216, py = 20+rand()*216, sz = rr(18,28);
      x.beginPath();
      for (let k = 0; k < 5; k++) {
        const a = k/5*Math.PI*2 + 0.3;
        const px2 = px + Math.cos(a)*sz, py2 = py + Math.sin(a)*sz;
        k===0 ? x.moveTo(px2,py2) : x.lineTo(px2,py2);
      }
      x.closePath(); x.fill();
      x.strokeStyle = '#f0f0f0'; x.lineWidth = 2;
      x.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6, bumpMap: tex, bumpScale: 0.25 });
  }
  const ball = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), mat);
  perturb(ball.geometry, r*0.015);
  ball.castShadow = true;
  ball.receiveShadow = true;
  return ball;
}
// Shelves on back wall (right side)
for (let s = 0; s < 4; s++) {
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.08, 0.5), woodMat);
  shelf.position.set(2.2, 1.35 + s*0.62, -BD/2 + 0.45);
  shelf.castShadow = true;
  booth.add(shelf);
  for (let i = 0; i < 7; i++) {
    const ball = makePrizeBall();
    ball.position.set(0.95 + i*0.42 + rr(-0.03,0.03), 1.35 + s*0.62 + 0.2, -BD/2 + 0.45 + rr(-0.05,0.05));
    booth.add(ball);
  }
}

// === HANGING PLUSH TOYS from ceiling ===
function makePlushToy() {
  const g = new THREE.Group();
  const bodyColor = pick([0x8a5a3a, 0xd4a878, 0x6a8ad4, 0xd48ad4, 0x8ad48a, 0xe8e0d0, 0xc4a05a]);
  // Fur-like material with slight fuzz
  const furTex = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const x = c.getContext('2d');
    const base = '#'+bodyColor.toString(16).padStart(6,'0');
    x.fillStyle = base; x.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 2000; i++) {
      x.strokeStyle = `rgba(${rand()>0.5?255:0},${rand()>0.5?255:0},${rand()>0.5?240:20},${rand()*0.12})`;
      x.lineWidth = 0.8;
      const fx = rand()*128, fy = rand()*128, a = rand()*Math.PI*2;
      x.beginPath(); x.moveTo(fx, fy); x.lineTo(fx+Math.cos(a)*4, fy+Math.sin(a)*4); x.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })();
  const mat = new THREE.MeshStandardMaterial({ map: furTex, roughness: 1, bumpMap: furTex, bumpScale: 0.3 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0e, roughness: 0.6 });
  // Body — pear shaped
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.14, 20, 16), mat);
  body.scale.set(1, 1.3, 0.88);
  perturb(body.geometry, 0.018);
  body.castShadow = true;
  g.add(body);
  // Belly patch (lighter)
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 10), new THREE.MeshStandardMaterial({ color: 0xf0e8d8, roughness: 1 }));
  belly.scale.set(1, 1.3, 0.5);
  belly.position.set(0, -0.02, 0.1);
  g.add(belly);
  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.105, 20, 16), mat);
  head.position.y = 0.24;
  perturb(head.geometry, 0.012);
  head.castShadow = true;
  g.add(head);
  // Snout
  const snout = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), new THREE.MeshStandardMaterial({ color: 0xe8d8c0, roughness: 1 }));
  snout.scale.set(1.2, 0.8, 0.9);
  snout.position.set(0, 0.22, 0.085);
  g.add(snout);
  // Nose
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 6), darkMat);
  nose.position.set(0, 0.235, 0.12);
  g.add(nose);
  // Eyes
  for (const sx of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.02, 10, 8), new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.15 }));
    eye.position.set(sx*0.045, 0.27, 0.075);
    g.add(eye);
    // Eye shine
    const shine = new THREE.Mesh(new THREE.SphereGeometry(0.007, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    shine.position.set(sx*0.045 + 0.007, 0.277, 0.09);
    g.add(shine);
  }
  // Ears — with inner ear
  for (const sx of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.048, 12, 10), mat);
    ear.scale.set(1, 1.2, 0.6);
    ear.position.set(sx*0.075, 0.325, -0.01);
    ear.rotation.z = sx*0.25;
    g.add(ear);
    const inner = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 6), new THREE.MeshStandardMaterial({ color: 0xd4a880, roughness: 1 }));
    inner.scale.set(1, 1.2, 0.4);
    inner.position.set(sx*0.075, 0.325, 0.02);
    inner.rotation.z = sx*0.25;
    g.add(inner);
  }
  // Arms with paws
  for (const sx of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), mat);
    arm.scale.set(0.9, 1.7, 0.9);
    perturb(arm.geometry, 0.01);
    arm.position.set(sx*0.165, 0.03, 0.01);
    arm.rotation.z = sx*0.45;
    arm.castShadow = true;
    g.add(arm);
  }
  // Legs/feet
  for (const sx of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 10), mat);
    leg.scale.set(1, 1.1, 1.3);
    perturb(leg.geometry, 0.01);
    leg.position.set(sx*0.075, -0.185, 0.03);
    g.add(leg);
  }
  // String
  const str = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.55, 5), new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.8 }));
  str.position.y = 0.6;
  g.add(str);
  // Hang tag
  const tag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.005), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 }));
  tag.position.set(0.03, 0.38, 0.02);
  tag.rotation.z = 0.3;
  g.add(tag);
  return g;
}
for (let i = 0; i < 12; i++) {
  const toy = makePlushToy();
  toy.position.set(rr(-4, 4), rr(3.4, 4.0), rr(-1.5, 2));
  toy.rotation.y = rand()*Math.PI*2;
  toy.rotation.z = rr(-0.15, 0.15);
  booth.add(toy);
}

// === FRONT COUNTER with realistic painted stripes ===
{
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const x = c.getContext('2d');
  const cols = ['#a02020', '#c89828', '#147070', '#c05818', '#a02020', '#147070'];
  const sw = 1024/12;
  for (let s = 0; s < 12; s++) {
    // Base paint with variation
    x.fillStyle = cols[s % 6];
    x.fillRect(s*sw, 0, sw+1, 256);
    // Paint brush strokes (vertical)
    for (let i = 0; i < 60; i++) {
      x.fillStyle = `rgba(${rand()>0.5?255:0},${rand()>0.5?255:0},${rand()>0.5?255:0},${rand()*0.06})`;
      const bx = s*sw + rand()*sw;
      x.fillRect(bx, 0, rr(1,3), 256);
    }
    // Paint chips showing wood underneath
    for (let i = 0; i < 25; i++) {
      if (rand() < 0.4) {
        x.fillStyle = `rgba(101,67,33,${rr(0.5,0.9)})`;
        x.beginPath();
        x.ellipse(s*sw + rand()*sw, rand()*256, rr(2,8), rr(1,4), rand()*3, 0, Math.PI*2);
        x.fill();
      }
    }
    // Scratches
    for (let i = 0; i < 15; i++) {
      x.strokeStyle = `rgba(0,0,0,${rr(0.1,0.3)})`;
      x.lineWidth = rr(0.5,1.5);
      const sx = s*sw + rand()*sw, sy = rand()*256;
      x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + rr(-20,20), sy + rr(-10,10)); x.stroke();
    }
    // Grime at bottom
    const grad = x.createLinearGradient(0, 180, 0, 256);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.35)');
    x.fillStyle = grad;
    x.fillRect(s*sw, 0, sw+1, 256);
  }
  // Panel seams between stripes
  x.fillStyle = 'rgba(0,0,0,0.4)';
  for (let s = 0; s <= 12; s++) {
    x.fillRect(s*sw - 1, 0, 2, 256);
  }
  // WINNERS text — painted, slightly worn
  x.fillStyle = 'rgba(245,245,240,0.92)';
  x.font = 'bold 88px Arial, sans-serif';
  x.textAlign = 'left';
  x.fillText('WINNERS', 40, 160);
  // Wear on text
  x.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 200; i++) {
    x.fillStyle = `rgba(0,0,0,${rand()*0.5})`;
    x.fillRect(40 + rand()*320, 90 + rand()*80, rr(1,4), rr(1,3));
  }
  x.globalCompositeOperation = 'source-over';
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  const counter = new THREE.Mesh(
    new THREE.BoxGeometry(BW, 1.1, 0.5, 8, 4, 2),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.65, bumpMap: tex, bumpScale: 0.15 })
  );
  // Slight surface imperfection
  const cp = counter.geometry.attributes.position;
  for (let i = 0; i < cp.count; i++) {
    if (Math.abs(cp.getZ(i)) > 0.24) {
      cp.setZ(i, cp.getZ(i) + (rand()-0.5)*0.008);
    }
  }
  counter.geometry.computeVertexNormals();
  counter.position.set(0, 0.65, BD/2 - 0.3);
  counter.castShadow = true; counter.receiveShadow = true;
  booth.add(counter);
  // Counter top
  const top = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.2, 0.08, 0.9), new THREE.MeshStandardMaterial({ color: 0x8a2a2a, roughness: 0.5 }));
  top.position.set(0, 1.24, BD/2 - 0.3);
  top.castShadow = true;
  booth.add(top);
}

// Basketballs on counter for playing
for (let i = 0; i < 5; i++) {
  const ball = makePrizeBall();
  // Force basketball type by color
  ball.material = new THREE.MeshStandardMaterial({ color: 0xd85818, roughness: 0.7 });
  ball.position.set(rr(-3.5, 3.5), 1.42, BD/2 - 0.3 + rr(-0.2, 0.2));
  booth.add(ball);
}

scene.add(booth);

// ============================================================
// SECOND BOOTH (right side, simpler)
// ============================================================
const booth2 = new THREE.Group();
{
  const w2 = 6, d2 = 4;
  // Structure
  const floor = new THREE.Mesh(new THREE.BoxGeometry(w2, 0.12, d2), new THREE.MeshStandardMaterial({ color: 0x4a3a28, roughness: 0.85 }));
  floor.position.y = 0.06;
  booth2.add(floor);
  const back = new THREE.Mesh(new THREE.BoxGeometry(w2, 3.2, 0.15), new THREE.MeshStandardMaterial({ color: 0xe8d8e8, roughness: 0.7 }));
  back.position.set(0, 1.7, -d2/2);
  booth2.add(back);
  // Pink/yellow sign
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#d42878'; x.fillRect(0, 0, 512, 128);
  x.fillStyle = '#ffe828';
  x.font = 'bold 56px Arial Black, sans-serif';
  x.textAlign = 'center';
  x.fillText('BALLOON POP', 256, 80);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sign = new THREE.Mesh(new THREE.BoxGeometry(4.5, 1.0, 0.12), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 }));
  sign.position.set(0, 3.0, -d2/2 + 0.15);
  booth2.add(sign);
  // Prize wall — plush toys on shelves
  for (let s = 0; s < 3; s++) {
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(w2 - 1, 0.08, 0.5), woodMat);
    shelf.position.set(0, 1.3 + s*0.65, -d2/2 + 0.45);
    booth2.add(shelf);
    for (let i = 0; i < 6; i++) {
      const toy = makePlushToy();
      toy.scale.setScalar(0.85);
      toy.position.set(-2.2 + i*0.88, 1.3 + s*0.65 + 0.18, -d2/2 + 0.45);
      booth2.add(toy);
    }
  }
  // Counter
  const counter = new THREE.Mesh(new THREE.BoxGeometry(w2, 1.0, 0.5), new THREE.MeshStandardMaterial({ color: 0xd42878, roughness: 0.7 }));
  counter.position.set(0, 0.6, d2/2 - 0.3);
  booth2.add(counter);
  // Light
  const l = new THREE.PointLight(0xffe0f0, 60, 12);
  l.position.set(0, 3.5, 0);
  booth2.add(l);
  
  booth2.position.set(8.5, 0, -1);
  booth2.rotation.y = -0.25;
  scene.add(booth2);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
