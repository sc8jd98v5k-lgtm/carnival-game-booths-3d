<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnival Game Booths — 3D Sample</title>
<style>
  body { margin: 0; overflow: hidden; background: #060608; font-family: system-ui, sans-serif; }
  #info {
    position: absolute; top: 12px; left: 12px; color: #fff;
    background: rgba(0,0,0,0.65); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; max-width: 300px; line-height: 1.5;
  }
  #info b { color: #ffd54a; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="info">
  <b>Carnival Game Booths</b> — from your photo<br>
  No humans · GTA-level detail target<br>
  Drag to orbit · Scroll to zoom
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let seed = 98765;
function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function rr(a, b) { return a + rand() * (b - a); }
function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060608);
scene.fog = new THREE.Fog(0x060608, 30, 70);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(3.5, 3.2, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.6, 0);
controls.update();

// Night ambient
scene.add(new THREE.AmbientLight(0x6a6a80, 0.4));

// Ground — asphalt
{
  const g = new THREE.CircleGeometry(32, 48);
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#1c1c1e'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 3000; i++) {
    x.fillStyle = `rgba(${rand()>0.5?255:0},${rand()>0.5?255:0},${rand()>0.5?255:10},${rand()*0.05})`;
    x.fillRect(rand()*256, rand()*256, 1.5, 1.5);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(8, 8);
  tex.colorSpace = THREE.SRGBColorSpace;
  const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 }));
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);
}

function perturb(geo, amp) {
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setXYZ(i, pos.getX(i)+(rand()-0.5)*amp, pos.getY(i)+(rand()-0.5)*amp, pos.getZ(i)+(rand()-0.5)*amp);
  }
  geo.computeVertexNormals();
  return geo;
}

// ============================================================
// MAIN BASKETBALL BOOTH
// ============================================================
const booth = new THREE.Group();
const BW = 9, BD = 5, WALL_H = 3.6;

// Bright interior lighting — like photo's fluorescent strips
const boothLight1 = new THREE.PointLight(0xfff4e0, 90, 16);
boothLight1.position.set(-2, 4.2, 1);
booth.add(boothLight1);
const boothLight2 = new THREE.PointLight(0xfff4e0, 90, 16);
boothLight2.position.set(2, 4.2, 1);
booth.add(boothLight2);
const frontWash = new THREE.SpotLight(0xffe8c0, 120, 25, Math.PI/4, 0.5);
frontWash.position.set(0, 5, 8);
frontWash.target.position.set(0, 2, 0);
booth.add(frontWash);
booth.add(frontWash.target);

// Structure
const frameMat = new THREE.MeshStandardMaterial({ color: 0x8a8a8e, roughness: 0.5, metalness: 0.4 });
{
// Floor
  const f = new THREE.Mesh(new THREE.BoxGeometry(BW, 0.12, BD), new THREE.MeshStandardMaterial({ color: 0x4a3a28, roughness: 0.85 }));
  f.position.y = 0.06; f.receiveShadow = true;
  booth.add(f);
  // Back wall — white with red trim (like photo)
  const bw = new THREE.Mesh(new THREE.BoxGeometry(BW, WALL_H, 0.15), new THREE.MeshStandardMaterial({ color: 0xe8e4dc, roughness: 0.7 }));
  bw.position.set(0, WALL_H/2 + 0.1, -BD/2);
  bw.receiveShadow = true;
  booth.add(bw);
  // Side walls
  for (const sx of [-1, 1]) {
    const sw = new THREE.Mesh(new THREE.BoxGeometry(0.15, WALL_H, BD), new THREE.MeshStandardMaterial({ color: 0xd8d4cc, roughness: 0.7 }));
    sw.position.set(sx*BW/2, WALL_H/2 + 0.1, 0);
    sw.castShadow = true;
    booth.add(sw);
  }
  // Roof frame
  const roof = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.6, 0.15, BD + 0.8), new THREE.MeshStandardMaterial({ color: 0x3a3a3e, roughness: 0.6 }));
  roof.position.set(0, WALL_H + 0.35, 0);
  roof.castShadow = true;
  booth.add(roof);
  // Striped awning edge (red/yellow/teal like photo)
  const ac = document.createElement('canvas');
  ac.width = 512; ac.height = 64;
  const ax = ac.getContext('2d');
  const stripeCols = ['#c02828', '#e8b828', '#189090', '#e87818'];
  for (let s = 0; s < 16; s++) {
    ax.fillStyle = stripeCols[s % 4];
    ax.fillRect(s*32, 0, 32, 64);
  }
  const atex = new THREE.CanvasTexture(ac);
  atex.wrapS = THREE.RepeatWrapping;
  atex.colorSpace = THREE.SRGBColorSpace;
  const awn = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.6, 0.5, 0.1), new THREE.MeshStandardMaterial({ map: atex, roughness: 0.8 }));
  awn.position.set(0, WALL_H + 0.05, BD/2 + 0.35);
  booth.add(awn);
  // Corner posts
  for (const sx of [-1,1]) for (const sz of [-1,1]) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, WALL_H + 0.5, 10), frameMat);
    p.position.set(sx*(BW/2-0.1), (WALL_H+0.5)/2, sz*(BD/2-0.1));
    p.castShadow = true;
    booth.add(p);
  }
}

// === WINS CHOICE SIGN ===
{
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 160;
  const x = c.getContext('2d');
  x.fillStyle = '#f5f2ec'; x.fillRect(0, 0, 1024, 160);
  x.fillStyle = '#d43818';
  x.font = 'bold 92px Arial Black, sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('WINS CHOICE', 512, 84);
  // Small basketball icon
  x.fillStyle = '#e87818';
  x.beginPath(); x.arc(950, 80, 34, 0, Math.PI*2); x.fill();
  x.strokeStyle = '#8a3818'; x.lineWidth = 3;
  x.beginPath(); x.arc(950, 80, 34, 0, Math.PI*2); x.stroke();
  x.beginPath(); x.moveTo(916, 80); x.lineTo(984, 80); x.stroke();
  x.beginPath(); x.moveTo(950, 46); x.lineTo(950, 114); x.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sign = new THREE.Mesh(new THREE.BoxGeometry(6.5, 1.0, 0.12), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 }));
  sign.position.set(-0.8, 3.35, -BD/2 + 0.15);
  booth.add(sign);
}

// === BASKETBALL HOOPS with real 3D nets ===
function makeHoop() {
  const g = new THREE.Group();
  // Backboard — white with red border
  const bb = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.65, 0.05), new THREE.MeshStandardMaterial({ color: 0xf0ece4, roughness: 0.5 }));
  bb.castShadow = true;
  g.add(bb);
  const border = new THREE.Mesh(new THREE.BoxGeometry(0.94, 0.69, 0.03), new THREE.MeshStandardMaterial({ color: 0xc02828, roughness: 0.6 }));
  border.position.z = -0.015;
  g.add(border);
  // Rim — orange metal
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.19, 0.022, 10, 24), new THREE.MeshStandardMaterial({ color: 0xe85818, roughness: 0.4, metalness: 0.5 }));
  rim.rotation.x = Math.PI/2;
  rim.position.set(0, -0.12, 0.22);
  rim.castShadow = true;
  g.add(rim);
  // Net — real 3D diamond pattern
  const netMat = new THREE.MeshStandardMaterial({ color: 0xf5f2ea, roughness: 0.9 });
  const netTopR = 0.18, netBotR = 0.11, netH = 0.32;
  const levels = 4, segs = 8;
  for (let l = 0; l < levels; l++) {
    const r0 = netTopR - (netTopR - netBotR) * (l/levels);
    const r1 = netTopR - (netTopR - netBotR) * ((l+1)/levels);
    const y0 = -0.12 - (l/levels)*netH, y1 = -0.12 - ((l+1)/levels)*netH;
    for (let s = 0; s < segs; s++) {
      const a0 = (s/segs)*Math.PI*2, a1 = ((s+0.5)/segs)*Math.PI*2, a2 = ((s+1)/segs)*Math.PI*2;
      // Diamond strands
      const p0 = new THREE.Vector3(Math.cos(a0)*r0, y0, 0.22 + Math.sin(a0)*r0);
      const p1 = new THREE.Vector3(Math.cos(a1)*r1, y1, 0.22 + Math.sin(a1)*r1);
      const p2 = new THREE.Vector3(Math.cos(a2)*r0, y0, 0.22 + Math.sin(a2)*r0);
      for (const [pa, pb] of [[p0,p1],[p1,p2]]) {
        const dir = new THREE.Vector3().subVectors(pb, pa);
        const len = dir.length();
        const strand = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, len, 4), netMat);
        strand.position.copy(pa).addScaledVector(dir, 0.5);
        strand.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
        g.add(strand);
      }
    }
  }
  return g;
}
for (let i = 0; i < 4; i++) {
  const hoop = makeHoop();
  hoop.position.set(-3.1 + i*1.35, 2.55, -BD/2 + 0.35);
  booth.add(hoop);
}

// === PRIZE SHELVES — colorful balls ===
function makePrizeBall() {
  const type = pick(['basketball', 'playground', 'beachball', 'soccer']);
  const r = rr(0.14, 0.19);
  let mat;
  if (type === 'basketball') {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const x = c.getContext('2d');
    x.fillStyle = pick(['#d85818', '#c04818', '#e87828']); x.fillRect(0, 0, 128, 128);
    x.strokeStyle = '#3a1a08'; x.lineWidth = 4;
    x.beginPath(); x.arc(64, 64, 60, 0, Math.PI*2); x.stroke();
    x.beginPath(); x.moveTo(4, 64); x.lineTo(124, 64); x.stroke();
    x.beginPath(); x.moveTo(64, 4); x.lineTo(64, 124); x.stroke();
    x.beginPath(); x.arc(20, 64, 45, -0.6, 0.6); x.stroke();
    x.beginPath(); x.arc(108, 64, 45, Math.PI-0.6, Math.PI+0.6); x.stroke();
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.65 });
  } else if (type === 'playground') {
    mat = new THREE.MeshStandardMaterial({ color: pick([0xd42a2a, 0x2a7ad4, 0x3aa83a, 0xe8b828, 0x8a3ad4, 0xe87818]), roughness: 0.5 });
  } else if (type === 'beachball') {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 64;
    const x = c.getContext('2d');
    const cols = ['#e83838', '#f0f0f0', '#2878e8', '#f0f0f0', '#38b838', '#f0f0f0'];
    for (let s = 0; s < 6; s++) { x.fillStyle = cols[s]; x.fillRect(s*22, 0, 22, 64); }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.4 });
  } else {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const x = c.getContext('2d');
    x.fillStyle = '#f0f0f0'; x.fillRect(0, 0, 128, 128);
    x.fillStyle = '#1a1a1a';
    for (let i = 0; i < 8; i++) {
      const px = rand()*128, py = rand()*128;
      x.beginPath();
      for (let k = 0; k < 5; k++) {
        const a = k/5*Math.PI*2;
        x.lineTo(px + Math.cos(a)*14, py + Math.sin(a)*14);
      }
      x.closePath(); x.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.55 });
  }
  const ball = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), mat);
  perturb(ball.geometry, r*0.03);
  ball.castShadow = true;
  return ball;
}
// Shelves on back wall (right side)
for (let s = 0; s < 4; s++) {
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.08, 0.5), new THREE.MeshStandardMaterial({ color: 0x6a4a2a, roughness: 0.8 }));
  shelf.position.set(2.2, 1.35 + s*0.62, -BD/2 + 0.45);
  shelf.castShadow = true;
  booth.add(shelf);
  for (let i = 0; i < 7; i++) {
    const ball = makePrizeBall();
    ball.position.set(0.95 + i*0.42 + rr(-0.03,0.03), 1.35 + s*0.62 + 0.2, -BD/2 + 0.45 + rr(-0.05,0.05));
    booth.add(ball);
  }
}

// === HANGING PLUSH TOYS from ceiling ===
function makePlushToy() {
  const g = new THREE.Group();
  const bodyColor = pick([0x8a5a3a, 0xd4a878, 0x6a8ad4, 0xd48ad4, 0x8ad48a, 0xe8e0d0]);
  const mat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 1 });
  // Body
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), mat);
  body.scale.set(1, 1.25, 0.85);
  perturb(body.geometry, 0.02);
  body.castShadow = true;
  g.add(body);
  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), mat);
  head.position.y = 0.22;
  perturb(head.geometry, 0.015);
  g.add(head);
  // Ears
  for (const sx of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), mat);
    ear.position.set(sx*0.07, 0.3, 0);
    g.add(ear);
  }
  // Arms
  for (const sx of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), mat);
    arm.scale.set(1, 1.6, 1);
    arm.position.set(sx*0.16, 0.02, 0);
    arm.rotation.z = sx*0.5;
    g.add(arm);
  }
  // Legs
  for (const sx of [-1, 1]) {
    const leg = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), mat);
    leg.scale.set(1, 1.4, 1);
    leg.position.set(sx*0.07, -0.18, 0);
    g.add(leg);
  }
  // String
  const str = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.5, 4), new THREE.MeshBasicMaterial({ color: 0xcccccc }));
  str.position.y = 0.55;
  g.add(str);
  return g;
}
for (let i = 0; i < 12; i++) {
  const toy = makePlushToy();
  toy.position.set(rr(-4, 4), rr(3.4, 4.0), rr(-1.5, 2));
  toy.rotation.y = rand()*Math.PI*2;
  toy.rotation.z = rr(-0.15, 0.15);
  booth.add(toy);
}

// === FRONT COUNTER with stripes ===
{
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  const cols = ['#c02828', '#e8b828', '#189090', '#e87818', '#c02828', '#189090'];
  for (let s = 0; s < 12; s++) {
    x.fillStyle = cols[s % 6];
    x.fillRect(s*(512/12), 0, 512/12+1, 128);
    // Wear
    for (let i = 0; i < 20; i++) {
      x.fillStyle = `rgba(0,0,0,${rand()*0.08})`;
      x.fillRect(s*(512/12) + rand()*(512/12), rand()*128, 2, 2);
    }
  }
  // WINNERS text
  x.fillStyle = '#ffffff';
  x.font = 'bold 44px Arial, sans-serif';
  x.textAlign = 'left';
  x.fillText('WINNERS', 20, 80);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const counter = new THREE.Mesh(new THREE.BoxGeometry(BW, 1.1, 0.5), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.75 }));
  counter.position.set(0, 0.65, BD/2 - 0.3);
  counter.castShadow = true; counter.receiveShadow = true;
  booth.add(counter);
  // Counter top
  const top = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.2, 0.08, 0.9), new THREE.MeshStandardMaterial({ color: 0x8a2a2a, roughness: 0.5 }));
  top.position.set(0, 1.24, BD/2 - 0.3);
  top.castShadow = true;
  booth.add(top);
}

// Basketballs on counter for playing
for (let i = 0; i < 5; i++) {
  const ball = makePrizeBall();
  // Force basketball type by color
  ball.material = new THREE.MeshStandardMaterial({ color: 0xd85818, roughness: 0.7 });
  ball.position.set(rr(-3.5, 3.5), 1.42, BD/2 - 0.3 + rr(-0.2, 0.2));
  booth.add(ball);
}

scene.add(booth);

// ============================================================
// SECOND BOOTH (right side, simpler)
// ============================================================
const booth2 = new THREE.Group();
{
  const w2 = 6, d2 = 4;
  // Structure
  const floor = new THREE.Mesh(new THREE.BoxGeometry(w2, 0.12, d2), new THREE.MeshStandardMaterial({ color: 0x4a3a28, roughness: 0.85 }));
  floor.position.y = 0.06;
  booth2.add(floor);
  const back = new THREE.Mesh(new THREE.BoxGeometry(w2, 3.2, 0.15), new THREE.MeshStandardMaterial({ color: 0xe8d8e8, roughness: 0.7 }));
  back.position.set(0, 1.7, -d2/2);
  booth2.add(back);
  // Pink/yellow sign
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#d42878'; x.fillRect(0, 0, 512, 128);
  x.fillStyle = '#ffe828';
  x.font = 'bold 56px Arial Black, sans-serif';
  x.textAlign = 'center';
  x.fillText('BALLOON POP', 256, 80);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sign = new THREE.Mesh(new THREE.BoxGeometry(4.5, 1.0, 0.12), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 }));
  sign.position.set(0, 3.0, -d2/2 + 0.15);
  booth2.add(sign);
  // Prize wall — plush toys on shelves
  for (let s = 0; s < 3; s++) {
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(w2 - 1, 0.08, 0.5), new THREE.MeshStandardMaterial({ color: 0x6a4a2a, roughness: 0.8 }));
    shelf.position.set(0, 1.3 + s*0.65, -d2/2 + 0.45);
    booth2.add(shelf);
    for (let i = 0; i < 6; i++) {
      const toy = makePlushToy();
      toy.scale.setScalar(0.85);
      toy.position.set(-2.2 + i*0.88, 1.3 + s*0.65 + 0.18, -d2/2 + 0.45);
      booth2.add(toy);
    }
  }
  // Counter
  const counter = new THREE.Mesh(new THREE.BoxGeometry(w2, 1.0, 0.5), new THREE.MeshStandardMaterial({ color: 0xd42878, roughness: 0.7 }));
  counter.position.set(0, 0.6, d2/2 - 0.3);
  booth2.add(counter);
  // Light
  const l = new THREE.PointLight(0xffe0f0, 60, 12);
  l.position.set(0, 3.5, 0);
  booth2.add(l);
  
  booth2.position.set(8.5, 0, -1);
  booth2.rotation.y = -0.25;
  scene.add(booth2);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
